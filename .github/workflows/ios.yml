name: iOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project ios/Cedar.xcodeproj -scheme Cedar
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          cedar_simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "id=$cedar_simulator_id" >> "$GITHUB_OUTPUT"
      - name: Test storage and recovery
        env:
          CEDAR_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: >-
          xcodebuild -project ios/Cedar.xcodeproj -scheme Cedar
          -destination "platform=iOS Simulator,id=$CEDAR_SIMULATOR_ID"
          -only-testing:CedarTests -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO test
